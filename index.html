<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style></head><body><title>Kaaoskartano</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;600;800&display=swap">
<style>
/* Layout: haunted game-show marquee. Host = projector stage (header / stage / player rail). Player = one-hand controller with four buzzer pads. Single dark look on purpose (projector + spooky mansion). */
:root{
  --ink:#120b1a; --wall:#1e1329; --wall2:#2b1c3b; --line:#43305a;
  --bone:#f5ede0; --dim:#b3a3c6; --blood:#ff3b5c; --ghost:#a6ecff;
  --b:#2f7dff; --o:#ff8a1f; --g:#22c46b; --y:#ffd23a;
  --on-b:#ffffff; --on-o:#1a0d05; --on-g:#06200f; --on-y:#241a00;
  --f-display:'Bungee','Impact','Arial Black',sans-serif;
  --f-body:'Rubik',system-ui,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--bone);font-family:var(--f-body);font-size:16px;line-height:1.4;overflow:hidden}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 40%,transparent 45%,rgba(0,0,0,.55) 100%);z-index:1}
#app{position:relative;z-index:2;height:100%;overflow:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;
  background-image:radial-gradient(circle at 20% 10%,rgba(255,59,92,.08),transparent 40%),radial-gradient(circle at 85% 90%,rgba(47,125,255,.09),transparent 45%),
  repeating-linear-gradient(90deg,rgba(255,255,255,.018) 0 2px,transparent 2px 46px)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--y);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--bone);background:var(--ink);border:2px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
.dim{color:var(--dim)}
.label{font-size:.78rem;text-transform:uppercase;letter-spacing:.14em;color:var(--dim);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:999px;font-weight:800;background:var(--wall2);border:2px solid var(--line);transition:transform .08s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--blood);border-color:var(--blood);color:#fff;box-shadow:0 6px 0 #8f1029}
.btn.primary:active{box-shadow:0 2px 0 #8f1029}
.btn.small{padding:7px 14px;font-size:.9rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.logo{font-family:var(--f-display);letter-spacing:.02em;line-height:.95}
.logo .a{color:var(--y);text-shadow:0 0 18px rgba(255,210,58,.35)}
.logo .b{color:var(--blood);text-shadow:0 0 18px rgba(255,59,92,.35)}

/* ---------- landing ---------- */
.landing{min-height:100%;display:grid;place-items:center;text-align:center}
.landing .inner{display:grid;gap:22px;max-width:640px;justify-items:center;padding-block:24px}
.landing .logo{font-size:clamp(2.6rem,9vw,5.4rem)}
.landing p{max-width:52ch;margin:0}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;width:100%}
.role{padding:22px 18px;border-radius:18px;background:var(--wall);border:2px solid var(--line);display:grid;gap:6px;text-align:left}
.role b{font-family:var(--f-display);font-weight:400;font-size:1.25rem}
.role:hover{border-color:var(--y)}
.role.play{border-color:var(--blood)}

/* ---------- host ---------- */
.host{height:100%;display:grid;grid-template-rows:auto 1fr auto;gap:12px}
.hbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hbar .logo{font-size:1.6rem}
.codechip{font-family:var(--f-display);font-size:1.3rem;background:var(--y);color:var(--on-y);padding:4px 14px;border-radius:10px;letter-spacing:.12em}
.hbar .grow{flex:1}
.stage{position:relative;min-height:0;display:grid;align-items:safe center;justify-items:center;overflow:auto;border-radius:22px;background:linear-gradient(180deg,var(--wall),var(--ink));border:2px solid var(--line);padding:clamp(14px,2.5vw,36px)}
.stage>.center{width:100%;max-width:1200px;display:grid;gap:clamp(12px,2vw,26px);justify-items:center;text-align:center}
.rail{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;min-height:56px}
.chip{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;background:var(--wall);border:2px solid var(--line);font-weight:600;position:relative}
.chip .av{font-size:1.5rem;width:38px;height:38px;display:grid;place-items:center;border-radius:50%;background:var(--wall2)}
.chip .sc{font-variant-numeric:tabular-nums;color:var(--y);font-weight:800}
.chip .cards{font-size:.8rem;letter-spacing:-.2em}
.chip.ghost{border-color:var(--ghost);color:var(--ghost);background:rgba(166,236,255,.06)}
.chip.ghost .av{filter:none}
.chip.off{opacity:.4}
.chip .st{font-weight:800}
.chip .st.ok{color:var(--g)} .chip .st.bad{color:var(--blood)}
.chip .kick{margin-left:2px;width:22px;height:22px;border-radius:50%;background:var(--wall2);font-size:.8rem;color:var(--dim)}
.host-bubble{display:flex;gap:14px;align-items:flex-start;max-width:900px;text-align:left}
.host-bubble .face{font-size:clamp(2.4rem,4vw,3.6rem);line-height:1;filter:drop-shadow(0 0 12px rgba(255,59,92,.4))}
.host-bubble .txt{background:var(--bone);color:var(--ink);padding:14px 18px;border-radius:4px 18px 18px 18px;font-size:clamp(1rem,1.6vw,1.35rem);font-weight:600}
.host-bubble .who{font-family:var(--f-display);font-size:.8rem;color:var(--blood);display:block;margin-bottom:2px}
.bigcode{font-family:var(--f-display);font-size:clamp(4rem,13vw,10rem);color:var(--y);line-height:1;letter-spacing:.12em;text-shadow:0 0 40px rgba(255,210,58,.35)}
.lobbygrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;width:100%;align-items:start;text-align:left}
@media (max-width:820px){.lobbygrid{grid-template-columns:1fr}}
.panel{background:var(--wall);border:2px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:12px}
.joinsteps{display:grid;gap:10px;font-size:clamp(1rem,1.5vw,1.25rem)}
.joinsteps .url{font-weight:800;color:var(--ghost);word-break:break-all}
.lobbyplayers{display:flex;flex-wrap:wrap;gap:10px}
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.settings label{display:grid;gap:4px;font-size:.85rem;color:var(--dim)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.netstat{font-size:.85rem;padding:6px 12px;border-radius:999px;background:var(--wall2)}
.netstat.ok{color:var(--g)} .netstat.err{color:var(--blood)}

.roundcard{display:grid;gap:10px;justify-items:center}
.roundcard .em{font-size:clamp(4rem,9vw,7rem);line-height:1;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.roundcard h2{font-size:clamp(2rem,5vw,4rem);color:var(--y)}
.roundcard p{font-size:clamp(1.05rem,1.8vw,1.5rem);max-width:40ch;margin:0}
.cat{display:inline-block;padding:4px 14px;border-radius:999px;border:2px solid var(--ghost);color:var(--ghost);font-weight:800;text-transform:uppercase;letter-spacing:.12em;font-size:.85rem}
.qtext{font-size:clamp(1.6rem,3.6vw,3.2rem);font-weight:800;line-height:1.15;max-width:28ch;text-wrap:balance}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:clamp(10px,1.4vw,18px);width:100%}
.opt{display:flex;align-items:center;gap:14px;padding:clamp(12px,1.6vw,22px);border-radius:20px;font-weight:800;font-size:clamp(1.1rem,2.1vw,1.9rem);text-align:left;position:relative;box-shadow:inset 0 -6px 0 rgba(0,0,0,.25),inset 0 6px 0 rgba(255,255,255,.18)}
.opt .dot{flex:none;width:clamp(30px,3vw,46px);height:clamp(30px,3vw,46px);border-radius:50%;background:rgba(255,255,255,.35);display:grid;place-items:center;font-family:var(--f-display);font-size:.8em}
.c0{background:var(--b);color:var(--on-b)} .c1{background:var(--o);color:var(--on-o)} .c2{background:var(--g);color:var(--on-g)} .c3{background:var(--y);color:var(--on-y)}
.opt.dimmed{opacity:.22;filter:grayscale(.6)}
.opt.right{outline:6px solid var(--bone);outline-offset:3px;animation:pulse 1s ease-in-out infinite}
.opt .pickers{margin-left:auto;font-size:.85em;letter-spacing:-.1em}
.timerbar{width:100%;height:14px;border-radius:999px;background:var(--wall2);overflow:hidden}
.timerbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--blood),var(--y));border-radius:inherit;transition:width .1s linear}
.secs{font-family:var(--f-display);font-size:clamp(1.6rem,3vw,2.6rem);color:var(--y);font-variant-numeric:tabular-nums}
.cellar h2{font-size:clamp(3rem,9vw,7.5rem);color:var(--blood);text-shadow:0 0 50px rgba(255,59,92,.5);animation:shake .6s}
.victims{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.victim{display:grid;justify-items:center;gap:4px;font-weight:800;font-size:clamp(1rem,1.6vw,1.4rem);min-width:110px}
.victim .av{font-size:clamp(2.6rem,5vw,4.4rem);line-height:1}
.victim .res{font-size:.9em;color:var(--dim);font-weight:600}
.victim.dead .av{filter:grayscale(1) brightness(.7)}
.victim.dead{color:var(--blood)}
.victim.alive{color:var(--g)}
.mgname{font-size:clamp(1.8rem,4vw,3.4rem);color:var(--y)}
.track{width:100%;display:grid;gap:8px}
.lane{display:grid;grid-template-columns:minmax(90px,160px) 1fr;gap:10px;align-items:center;text-align:left;font-weight:700}
.lane .cells{display:grid;grid-template-columns:repeat(var(--n),1fr) auto;gap:4px;align-items:center}
.cell{height:clamp(26px,3vw,40px);border-radius:8px;background:var(--wall2);display:grid;place-items:center;font-size:clamp(1rem,2vw,1.6rem)}
.cell.me{background:var(--line)}
.lane.ghost{color:var(--ghost)}
.exit{font-size:clamp(1.4rem,2.6vw,2.2rem)}
.podium{display:grid;gap:8px;justify-items:center}
.podium .crown{font-size:clamp(3rem,7vw,5.5rem);line-height:1;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
.podium h2{font-size:clamp(2rem,4.5vw,3.8rem);color:var(--y)}
.scoreboard{display:grid;gap:6px;width:min(560px,100%)}
.scoreboard .r{display:flex;gap:12px;align-items:center;padding:8px 14px;border-radius:12px;background:var(--wall);font-weight:700}
.scoreboard .r b{margin-left:auto;color:var(--y);font-variant-numeric:tabular-nums}
#toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:calc(70px + env(safe-area-inset-top,0px));display:grid;gap:8px;z-index:20;width:min(420px,calc(100% - 32px));pointer-events:none}
.toast{background:var(--bone);color:var(--ink);padding:10px 14px;border-radius:14px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:slidein .35s cubic-bezier(.2,1.4,.4,1);display:flex;gap:10px;align-items:center}
.toast .e{font-size:1.6rem}
.toast.red{background:var(--blood);color:#fff}
#floaters{position:fixed;inset:0;pointer-events:none;z-index:15;overflow:hidden}
.floater{position:absolute;bottom:-60px;font-size:2.6rem;animation:floatup 3.2s ease-out forwards}
.floater small{display:block;font-size:.8rem;font-weight:700;color:var(--bone);text-align:center}
.qpanel{position:fixed;inset:0;z-index:30;background:rgba(10,5,15,.85);display:grid;place-items:center;padding:16px}
.qpanel .panel{width:min(760px,100%);max-height:90%;overflow:auto}
.qpanel textarea{min-height:240px;font-size:.9rem;font-family:ui-monospace,Consolas,monospace}

/* ---------- player ---------- */
.player{min-height:100%;display:grid;grid-template-rows:auto 1fr auto;gap:12px;max-width:760px;margin:0 auto}
.pbar{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:16px;background:var(--wall);border:2px solid var(--line)}
.pbar .av{font-size:1.8rem}
.pbar .nm{font-weight:800}
.pbar .sc{margin-left:auto;font-family:var(--f-display);color:var(--y);font-variant-numeric:tabular-nums}
.pmain{display:grid;align-content:center;gap:16px;text-align:center;min-height:0}
.pmain h2{font-size:clamp(1.6rem,6vw,2.6rem)}
.pmain .big{font-size:clamp(3.5rem,14vw,6rem);line-height:1}
.pads{display:grid;grid-template-columns:1fr 1fr;gap:12px;position:relative}
.pad{min-height:clamp(90px,18vh,160px);border-radius:22px;font-weight:800;font-size:clamp(1rem,3.4vw,1.4rem);padding:14px;display:grid;place-items:center;text-align:center;box-shadow:inset 0 -8px 0 rgba(0,0,0,.28),inset 0 8px 0 rgba(255,255,255,.2),0 6px 0 rgba(0,0,0,.35);transition:transform .06s,filter .2s}
.pad:active{transform:translateY(4px)}
.pad[disabled]{cursor:not-allowed}
.pad.picked{outline:5px solid var(--bone);outline-offset:3px}
.pads.locked .pad:not(.picked){opacity:.3}
.pads.mirror{transform:scaleX(-1)}
.pads.frozen .pad{filter:saturate(.2) brightness(1.4) hue-rotate(160deg)}
.ink{position:absolute;inset:0;pointer-events:none;z-index:3}
.ink i{position:absolute;border-radius:50%;background:radial-gradient(circle at 40% 40%,#0b0610 0 55%,rgba(11,6,16,.9) 60%,transparent 72%)}
.ice{position:absolute;inset:-6px;border-radius:24px;z-index:4;display:grid;place-items:center;background:rgba(166,236,255,.25);backdrop-filter:blur(2px);font-family:var(--f-display);font-size:1.6rem;color:var(--ink);pointer-events:none}
.effects{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.effect{background:var(--blood);color:#fff;padding:6px 12px;border-radius:999px;font-weight:700;font-size:.9rem}
.hand{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.card{padding:14px;border-radius:16px;background:var(--wall2);border:2px solid var(--line);display:grid;gap:4px;text-align:left}
.card .e{font-size:2rem;line-height:1}
.card b{font-family:var(--f-display);font-weight:400}
.card small{color:var(--dim);font-size:.8rem}
.card.sel{border-color:var(--y);background:#3a2a1a}
.card.passive{opacity:.75;cursor:default}
.targets{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.target{padding:12px;border-radius:14px;background:var(--wall);border:2px solid var(--blood);font-weight:800;display:flex;gap:8px;align-items:center;justify-content:center}
.bets{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.bet{padding:10px 16px;border-radius:999px;background:var(--wall2);border:2px solid var(--line);font-weight:800}
.bet.sel{background:var(--y);color:var(--on-y);border-color:var(--y)}
.reacts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.reacts button{font-size:1.7rem;width:54px;height:54px;border-radius:50%;background:var(--wall);border:2px solid var(--line)}
.reactbox{height:min(52vh,360px);border-radius:24px;display:grid;place-items:center;font-family:var(--f-display);font-size:clamp(1.8rem,8vw,3rem);background:var(--blood);color:#fff;user-select:none}
.reactbox.go{background:var(--g);color:var(--on-g)}
.reactbox.done{background:var(--wall2);color:var(--bone)}
.mpads{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mpad{height:clamp(90px,20vh,150px);border-radius:22px;opacity:.45;transition:opacity .1s,transform .1s}
.mpad.lit{opacity:1;transform:scale(1.04);box-shadow:0 0 40px currentColor}
.doors{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.door{height:clamp(150px,34vh,260px);border-radius:60px 60px 8px 8px;background:linear-gradient(180deg,#5a3a24,#3a2414);border:4px solid #2a180c;font-family:var(--f-display);font-size:2rem;color:var(--y);position:relative}
.door::after{content:"";position:absolute;right:16%;top:55%;width:12px;height:12px;border-radius:50%;background:var(--y)}
.door.sel{outline:5px solid var(--y);outline-offset:3px}
.mathq{font-family:var(--f-display);font-size:clamp(2.2rem,9vw,3.6rem);color:var(--y)}
.mathrow{display:flex;gap:10px;max-width:360px;margin:0 auto;width:100%}
.mathrow input{font-size:1.6rem;text-align:center}
.joinform{display:grid;gap:14px;max-width:440px;margin:0 auto;width:100%;text-align:left}
.joinform .codein{font-family:var(--f-display);font-size:2.2rem;text-align:center;letter-spacing:.3em;text-transform:uppercase}
.emojis{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.emojis button{font-size:1.7rem;height:52px;border-radius:12px;background:var(--wall);border:2px solid var(--line)}
.emojis button.sel{border-color:var(--y);background:var(--wall2)}
.err{color:var(--blood);font-weight:700}
body.is-ghost #app{background-color:#0d1420}
body.is-ghost .pbar{border-color:var(--ghost)}

.guesshint{font-size:clamp(1.2rem,2.4vw,2rem);font-weight:800;color:var(--ghost);padding:18px 26px;border:3px dashed var(--ghost);border-radius:20px}
.guesslist{display:grid;gap:6px;width:min(820px,100%)}
.guesslist .g{display:grid;grid-template-columns:2.2em minmax(0,1fr) auto auto 4.5em;gap:12px;align-items:center;padding:8px 14px;border-radius:12px;background:var(--wall);font-weight:700;text-align:left;font-size:clamp(.95rem,1.6vw,1.25rem)}
.guesslist .g .m{font-size:1.4em}
.guesslist .gv{font-family:var(--f-display);color:var(--bone);font-variant-numeric:tabular-nums}
.guesslist .gd{color:var(--dim);font-size:.85em}
.guesslist .g b{color:var(--g);text-align:right;font-variant-numeric:tabular-nums}
.guesslist .g.best{background:#2a2410;outline:2px solid var(--y)}
.guesslist .g.worst{background:#33101a;outline:2px solid var(--blood)}
.guessbox{font-family:var(--f-display);font-size:clamp(2.2rem,10vw,3.4rem);color:var(--y);background:var(--ink);border:3px solid var(--line);border-radius:18px;padding:8px 14px;min-height:1.6em;font-variant-numeric:tabular-nums;overflow-x:auto}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keypad.mirror{transform:scaleX(-1)}
.keypad.frozen .key{filter:saturate(.2) brightness(1.4) hue-rotate(160deg)}
.key{height:clamp(52px,9vh,70px);border-radius:14px;background:var(--wall2);border:2px solid var(--line);font-family:var(--f-display);font-size:1.5rem;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.key:active{transform:translateY(3px);box-shadow:none}
@media (max-width:560px){.guesslist .g{grid-template-columns:2em minmax(0,1fr) auto;}.guesslist .gd,.guesslist .g b{display:none}}
.packs{display:grid;gap:6px}
.packrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pack{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:8px;align-items:center;text-align:left;padding:8px 12px;border-radius:14px;background:var(--ink);border:2px solid var(--line);font-weight:700;font-size:.92rem}
.pack .pe{grid-row:span 2;font-size:1.5rem}
.pack small{color:var(--dim);font-weight:600}
.pack.on{border-color:var(--y);background:#2e2512}
.pack.on small{color:var(--y)}
.pack[disabled]{opacity:.4;cursor:not-allowed}
.pq{font-size:clamp(1.1rem,4vw,1.5rem);font-weight:800}
.mirror{transform:scaleX(-1)}
.frozen>button,.frozen input{filter:saturate(.2) brightness(1.4) hue-rotate(160deg)}
.olist{display:grid;gap:8px;position:relative}
.oitem{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--wall2);border:2px solid var(--line);font-weight:700;font-size:clamp(1rem,3.6vw,1.2rem);text-align:left;min-height:58px}
.oitem .onum{flex:none;width:34px;height:34px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;font-family:var(--f-display);color:var(--ink)}
.oitem.on{border-color:var(--y);background:#2e2512}

const normTxt = x => String(x || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]/g, '');
function lev(a, b) {
  if (a === b) return 0; const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({length: n + 1}, (_, j) => j);
  for (let i = 1; i <= m; i++) { const cur = [i]; for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = cur; }
  return prev[n];
}
function matchList(text, norms) {
  const t = normTxt(text); if (!t) return -1;
  for (let i = 0; i < norms.length; i++) if (norms[i].includes(t)) return i;
  for (let i = 0; i < norms.length; i++) for (const a of norms[i]) { const tol = a.length >= 8 ? 2 : a.length >= 4 ? 1 : 0; if (tol && Math.abs(a.length - t.length) <= tol && lev(a, t) <= tol) return i; }
  for (let i = 0; i < norms.length; i++) for (const a of norms[i]) if (a.length >= 5 && t.length > a.length && t.endsWith(a)) return i;
  return -1;
}

function tone(f, d = .15, type = 'square', vol = .06, when = 0, f2) {
  const ac = audio(); if (!ac || !G.sound) return;
  const t = ac.currentTime + when, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d + .02);
}

/* ---------- host networking ---------- */
function hostNet() {
  try { if (G.bc) G.bc.close(); } catch (e) {}
  (G.mqs || []).forEach(c => { c.onclose = null; c.close(); });
  G.mqs = []; G.net = BROKERS.map(b => ({name: b.name, state: 'wait'}));
  const code = G.code;
  try {
    G.bc = new BroadcastChannel('kk-' + code);
    G.bc.onmessage = e => {
      const m = e.data; if (!m || m.to !== 'host') return;
      const from = 'bc:' + m.from;
      if (m.data && m.data.t === 'ping') { G.bc.postMessage({to: m.from, data: {t: 'pong'}}); return; }
      G.conns[from] = d => { try { G.bc.postMessage({to: m.from, data: d}); } catch (e) {} };
      onNet(from, m.data);
    };
  } catch (e) {}
  BROKERS.forEach((b, i) => connectBroker(i, code));
}
function connectBroker(i, code) {
  if (G.code !== code) return;
  const c = new MiniMqtt(BROKERS[i].url); G.mqs[i] = c;
  c.connect(8000).then(() => {
    c.subscribe(TOPIC(code) + '/h');
    c.onmessage = (topic, payload) => {
      let m; try { m = JSON.parse(payload); } catch (e) { return; }
      if (!m || typeof m.f !== 'string' || !m.d) return;
      const reply = d => c.publish(TOPIC(code) + '/c/' + m.f, JSON.stringify(d));
      if (m.d.t === 'ping') { reply({t: 'pong'}); return; }
      const cid = 'm' + i + ':' + m.f;
      G.conns[cid] = reply; onNet(cid, m.d);
    };
    c.onclose = () => { G.net[i].state = 'err'; netChanged(); setTimeout(() => connectBroker(i, code), 3000); };
    G.net[i].state = 'ok'; netChanged();
  }).catch(() => { G.net[i].state = 'err'; netChanged(); setTimeout(() => connectBroker(i, code), 15000); });
}
function netChanged() {
  G.netOk = G.net.some(n => n.state === 'ok');
  G.netErr = !G.netOk && G.net.every(n => n.state === 'err') ? 'Ei yhteyttä pelipalvelimiin. Verkko voi estää ne. Testibotit toimivat silti.' : '';
  if (G.phase === 'lobby') renderHost();
}
setInterval(() => {
  if (G.role !== 'host') return; let changed = false;
  for (const p of plist()) if (!p.bot && p.connected && Date.now() - (p.lastSeen || 0) > 16000) { p.connected = false; changed = true; }
  if (changed) renderHost();
}, 4000);
function sendTo(p, d) { if (p.bot || !p.conn) return; const f = G.conns[p.conn]; if (f) f(d); }
function onClose(connId) {
  const pid = G.connOf[connId]; delete G.conns[connId];
  if (pid && G.players[pid] && G.players[pid].conn === connId) { G.players[pid].connected = false; renderHost(); }

  if (type === 'varit') G.mg.seq = Array.from({length: 10}, () => { const w = rnd(4); return {w, c: Math.random() < .85 ? (w + 1 + rnd(3)) % 4 : w}; });
  if (type === 'kirstut') { G.mg.golds = {}; G.mg.traps = {}; for (const id of G.cellar) { G.mg.golds[id] = Array.from({length: 8}, () => 60 + rnd(11) * 10); G.mg.traps[id] = 2 + rnd(6); } }
  SFX.death();
  setPhase('cellar', 7000, () => setPhase('minigame', MG[type].dur, endMinigame));
}
function makeMath() {
  const out = [];
  const a = (x, y) => x + rnd(y - x + 1);
  let x, y; x = a(12, 49); y = a(11, 49); out.push({q: `${x} + ${y}`, a: x + y});
  x = a(3, 9); y = a(4, 9); out.push({q: `${x} × ${y}`, a: x * y});
  x = a(50, 99); y = a(11, 39); out.push({q: `${x} − ${y}`, a: x - y});
  x = a(6, 12); y = a(3, 8); let z = a(2, 20); out.push({q: `${x} × ${y} + ${z}`, a: x * y + z});
  y = a(3, 9); x = y * a(3, 9); out.push({q: `${x} ÷ ${y}`, a: x / y});
  return shuffle(out);
}
function mgBad(type, r) {
  r = r || {};
  if (type === 'reaktio') return r.ms == null ? 9999 : r.ms;
  if (type === 'muisti' || type === 'matikka') return (5 - (r.count || 0)) * 1e6 + (r.t || 99999);
  if (type === 'varit') return (10 - (r.count || 0)) * 1e6 + (r.t || 99999);
  if (type === 'kirstut') return 1e6 - (r.gold || 0);
  return 0;
}
function mgLabel(type, r) {
  r = r || {};
  if (type === 'reaktio') return r.ms == null ? 'ei painanut' : r.ms >= 9999 ? 'varaslähtö!' : r.ms + ' ms';
  if (type === 'muisti') return (r.count || 0) + '/5';
  if (type === 'matikka') return (r.count || 0) + '/5 oikein';
  if (type === 'ovet') return r.door == null ? 'jähmettyi' : 'ovi ' + (r.door + 1);
  if (type === 'varit') return (r.count || 0) + '/10 oikein';
  if (type === 'kirstut') return r.trapped ? '👹 ansa!' : (r.gold || 0) + ' kultaa';
  if (type === 'uhri') return '🕯️ ' + (r.bid || 0) + ' p';
  return '';
}
function endMinigame() {
  const mg = G.mg, ids = G.cellar.filter(id => G.players[id]);
  const fail = new Set();
  for (const id of ids) {
    const r = mg.results[id] || {};
    if (mg.type === 'reaktio') { const ms = mgBad('reaktio', r); if (ms >= 9999 || (ids.length === 1 && ms > 450)) fail.add(id); }
    if (mg.type === 'muisti' && (r.count || 0) < 5) fail.add(id);
    if (mg.type === 'matikka' && (r.count || 0) < 4) fail.add(id);
    if (mg.type === 'ovet' && (r.door == null || r.door === mg.trap)) fail.add(id);
    if (mg.type === 'varit' && (r.count || 0) < 8) fail.add(id);
    if (mg.type === 'kirstut' && (r.gold || 0) < 400) fail.add(id);
  }
  if (mg.type === 'uhri' && ids.length) {
    const bids = ids.map(id => (mg.results[id] && mg.results[id].bid) || 0), mn = Math.min(...bids);
    ids.forEach((id, i) => { if (bids[i] === mn) fail.add(id); const p = G.players[id]; p.score = Math.max(0, p.score - bids[i]); });
    const tot = bids.reduce((a, b) => a + b, 0); if (tot) toast(`Kellarimestari keräsi uhreina ${tot} pistettä`, '🕯️', true);
  }
  if (ids.length >= 2 && fail.size === 0 && mg.type !== 'ovet' && mg.type !== 'uhri') {
    const worst = Math.max(...ids.map(id => mgBad(mg.type, mg.results[id])));
    ids.filter(id => mgBad(mg.type, mg.results[id]) === worst).forEach(id => fail.add(id));
  }
  G.lastDeaths = [...fail];
  for (const id of fail) { const p = G.players[id]; p.ghost = true; if (p.cards.length < 2) p.cards.push('muste'); }
  if (fail.size) { SFX.death(); quip('death', {n: G.lastDeaths.map(id => G.players[id].name).join(' ja ')}); }
  else { SFX.right(); quip('survive'); }
  setPhase('mg_result', 7500, () => { G.qi++; nextQuestion(); });
}

/* ---------- finale ---------- */
function startFinale() {
  G.finale = true; G.fq = 0; G.cellar = []; resetRoundState();
  const living = plist().filter(p => !p.ghost).sort((a, b) => b.score - a.score);
  for (const p of plist()) p.pos = p.ghost ? 0 : 2;
  if (living[0]) living[0].pos = 3;
  quip('finale');
  setPhase('finale_intro', 9000, finaleQuestion);
}
function finaleQuestion() {
  resetRoundState(); G.roundType = 'nopein';
  G.cur = makeQ(G.qList[G.settings.rounds + G.fq] || pick(QBANK));
  dealCards(true);
  setPhase('prep', 6000, startQuestion);
}
function finaleReveal() {
  const c = G.cur.correct;
  const right = plist().filter(p => p.answer === c).sort((a, b) => a.answerT - b.answerT);
  for (const p of plist()) p.move = 0;
  right.forEach((p, i) => { p.move = i === 0 ? 2 : 1; p.pos = Math.min(TRACK, p.pos + p.move); });
  const living = plist().filter(p => !p.ghost);
  for (const g of plist().filter(p => p.ghost && p.move > 0)) {
    if (living.some(l => l.pos <= g.pos)) { g.ghost = false; toast(`${g.name} ohitti elävän ja heräsi henkiin!`, '🧟', true); }
  }
  right.length ? SFX.right() : SFX.wrong();
  const live2 = plist().filter(p => !p.ghost);
  let cands = live2.filter(p => p.pos >= TRACK);
  if (!live2.length) cands = plist().filter(p => p.pos >= TRACK);
  const order = (a, b) => (b.pos - a.pos) || ((a.answer === c ? a.answerT : 1e9) - (b.answer === c ? b.answerT : 1e9));
  if (!cands.length && G.fq >= 14) cands = (live2.length ? live2 : plist()).slice();
  G.winner = cands.length ? cands.sort(order)[0].id : null;
  G.cellar = [];
  setPhase('reveal', 6000, () => {
    if (G.winner) { quip('win', {n: G.players[G.winner].name}); SFX.win(); setPhase('end'); }
    else { G.fq++; finaleQuestion(); }
  });
}

/* ---------- player actions (host side) ---------- */
function handle(p, d) {
  const now = Date.now();
  if (d.t === 'react') {
    if (now - p.lastReact < 900) return; p.lastReact = now;
    if (['👻','😱','😂','🔥','💀','👏'].includes(d.e)) floater(d.e, p.name); return;
  }
  if (d.t === 'play' && G.phase === 'prep') {
    const i = p.cards.indexOf(d.card); const t = G.players[d.target];
    if (i < 0 || !t || t.id === p.id || CARDS[d.card].passive) return;
    p.cards.splice(i, 1);
    const c = CARDS[d.card];
    const ki = t.cards.indexOf('kilpi');
    if (ki >= 0) {
      t.cards.splice(ki, 1); p.effects[d.card] = t.name;
      toast(`${t.name} torjui kilvellä ja palautti ${c.name}-kortin pelaajalle ${p.name}!`, '🛡️', true);
    } else {
      t.effects[d.card] = p.name;
      toast(`${p.name} → ${t.name}: ${c.name}`, c.emoji);
    }
    SFX.attack(); renderHost(); sync(); return;
  }
  if (d.t === 'bet' && G.phase === 'prep' && G.roundType === 'pommi' && !G.finale) {
    const amt = d.amount === 'all' ? p.score : Math.max(0, Math.min(Number(d.amount) || 0, p.score));
    p.bet = amt; renderHost(); sync(); return;
  }
  if (G.phase === 'question' && G.cur.kind === 'list' && (d.t === 'listadd' || d.t === 'listdone')) {
    if (p.answer != null || now > p.deadline + 1500 || now < p.lockUntil) return;
    if (d.t === 'listdone') { p.answer = 'done'; p.answerT = now - G.qStart; renderHost(); sync(); checkAllAnswered(); return; }
    const txt = String(d.text || '').trim().slice(0, 40); if (!txt || (p.list || []).length >= 40) return;
    const idx = matchList(txt, G.cur.norms); const dup = idx >= 0 && p.list.some(x => x.idx === idx);
    p.list.push({txt, idx: dup ? -1 : idx, ok: idx >= 0 && !dup, dup}); renderHost(); sync(); return;
  }
  if (d.t === 'answer' && G.phase === 'question' && G.cur.kind === 'tf') {
    if (p.answer != null || now > p.deadline + 1500 || now < p.lockUntil || !Array.isArray(d.tf)) return;
    const n = G.cur.sts.length, arr = d.tf.slice(0, n).map(x => !!x);
    if (arr.length < (p.tfAns || []).length) return;
    p.tfAns = arr; if (d.final || arr.length >= n) { p.answer = arr; p.answerT = now - G.qStart; }
    renderHost(); sync(); checkAllAnswered(); return;
  }
  if (d.t === 'answer' && G.phase === 'question' && G.cur.kind === 'order') {
    if (p.answer != null || now > p.deadline + 1500 || now < p.lockUntil || !Array.isArray(d.order)) return;
    const n = G.cur.items.length, o = d.order.map(Number);
    if (o.length !== n || new Set(o).size !== n || o.some(x => !(x >= 0 && x < n))) return;
    p.answer = o; p.answerT = now - G.qStart; renderHost(); sync(); checkAllAnswered(); return;
  }
  if (d.t === 'answer' && G.phase === 'question') {
    if (p.answer != null || now > p.deadline || now < p.lockUntil) return;
    if (G.cur.num) { const g = Number(String(d.guess).replace(',', '.')); if (!isFinite(g) || String(d.guess).trim() === '') return; p.answer = g; }
    else { const idx = Number(d.idx); if (!(idx >= 0 && idx < G.cur.opts.length)) return; p.answer = idx; } p.answerT = now - G.qStart;
    renderHost(); sync(); checkAllAnswered(); return;
  }
  if (d.t === 'steal' && G.phase === 'steal') {
    if (p.answer !== G.cur.correct || p.stealTarget) return;
    const t = G.players[d.target]; if (!t || t.id === p.id) return;
    p.stealTarget = t.id; renderHost(); sync();
    const robbers = present().filter(x => x.answer === G.cur.correct);
    if (robbers.every(x => x.stealTarget)) { clearTimeout(G.timer); G.next = null; G.timer = setTimeout(resolveSteal, 700); }
    return;
  }
  if (d.t === 'mg' && G.phase === 'minigame' && G.mg && d.id === G.mg.id && G.cellar.includes(p.id)) {
    const prev = G.mg.results[p.id]; if (prev && prev.final) return;
    const r = d.r || {}; let clean = {final: !!r.final};
    if (G.mg.type === 'varit') { clean.count = Math.max(0, Math.min(10, r.count | 0)); clean.t = Number(r.t) || 99999; }
    if (G.mg.type === 'kirstut') {
      const st = Object.assign({opened: 0, gold: 0, trapped: false}, prev || {}); clean = st;
      if (r.open) {
        const o = st.opened + 1, golds = G.mg.golds[p.id];
        if (o >= G.mg.traps[p.id]) Object.assign(st, {opened: o, gold: 0, trapped: true, final: true});
        else Object.assign(st, {opened: o, gold: golds.slice(0, o).reduce((a, b) => a + b, 0)});
      }
      if (r.stop) st.final = true;
    }
    if (G.mg.type === 'uhri') { clean.bid = Math.max(0, Math.min(p.score, Math.round(Number(r.bid) || 0))); clean.final = true; }
    if (G.mg.type === 'reaktio') clean.ms = Math.max(0, Math.min(9999, Math.round(Number(r.ms)))), clean.final = true;
    if (G.mg.type === 'muisti') { clean.count = Math.max(0, Math.min(5, r.count | 0)); clean.t = Number(r.t) || 99999; }
    if (G.mg.type === 'matikka') {
      const answers = Array.isArray(r.answers) ? r.answers.slice(0, 5) : [];
      clean.count = answers.filter((a, i) => G.mg.probs[i] && Number(a) === G.mg.probs[i].a).length; clean.t = Number(r.t) || 99999;
    }
    if (G.mg.type === 'ovet') { const dd = Number(r.door); clean.door = dd >= 0 && dd < 3 ? dd : null; clean.final = true; }
    G.mg.results[p.id] = clean; renderHost(); sync();
    const ids = G.cellar.filter(id => G.players[id] && (G.players[id].bot || G.players[id].connected));
    if (ids.every(id => G.mg.results[id] && G.mg.results[id].final)) { clearTimeout(G.timer); G.next = null; G.timer = setTimeout(endMinigame, 1200); }
  }
}

/* ---------- bots ---------- */
function botsAct() {
  const k = phaseKey();
  const later = (ms, fn) => setTimeout(() => { if (phaseKey() === k) fn(); }, ms);
  for (const p of plist().filter(p => p.bot)) {
    if (G.phase === 'prep') {
      const playable = p.cards.filter(c => !CARDS[c].passive);
      if (playable.length && Math.random() < .6) later(1000 + rnd(4500), () => {
        const others = plist().filter(x => x.id !== p.id); if (!others.length) return;
        handle(p, {t: 'play', card: pick(playable), target: pick(others).id});
      });
      if (G.roundType === 'pommi' && !G.finale) later(800 + rnd(3000), () => handle(p, {t: 'bet', amount: pick([0, 100, 250, 500, 'all'])}));
    }
    if (G.phase === 'question' && G.cur.kind === 'list') {
      const picks = shuffle(G.cur.answers.map((_, i) => i)).slice(0, 1 + rnd(5));
      picks.forEach((i, j) => later((p.lockUntil ? 4200 : 0) + 2000 + j * (2500 + rnd(3000)), () => handle(p, {t: 'listadd', text: G.cur.answers[i]})));
      if (Math.random() < .4) later(5000 + rnd(9000), () => handle(p, {t: 'listadd', text: pick(['banaani', 'en tiedä', 'joku'])}));
      later(Math.min(picks.length * 5500 + 4000, (p.deadline - Date.now()) - 1500), () => handle(p, {t: 'listdone'}));
    }
    else if (G.phase === 'question') later(Math.max(300, (p.lockUntil ? 4200 : 0) + 1500 + rnd(Math.max(1500, (p.deadline - Date.now()) * .7))), () => {
      if (G.cur.kind === 'order') { handle(p, {t: 'answer', order: Math.random() < .45 ? G.cur.sol.slice() : shuffle(G.cur.items.map((_, i) => i))}); return; }
      if (G.cur.kind === 'tf') { handle(p, {t: 'answer', tf: G.cur.sts.map(s => Math.random() < .72 ? s.v : !s.v), final: true}); return; }
      if (G.cur.num) { const a = G.cur.ans, spread = Math.abs(a) * .12 + 4; handle(p, {t: 'answer', guess: String(Math.round((a + (Math.random() * 2 - 1) * spread) * 10) / 10)}); return; }
      const ok = Math.random() < .55; const n = G.cur.opts.length;
      handle(p, {t: 'answer', idx: ok ? G.cur.correct : (G.cur.correct + 1 + rnd(n - 1)) % n});
    });
    if (G.phase === 'steal') later(1500 + rnd(3000), () => {
      const others = plist().filter(x => x.id !== p.id); if (others.length) handle(p, {t: 'steal', target: pick(others).id});
    });
    if (G.phase === 'minigame' && G.cellar.includes(p.id)) later(2500 + rnd(5000), () => {
      const t = G.mg.type, id = G.mg.id; let r = {final: true};
      if (t === 'reaktio') r.ms = Math.random() < .1 ? 9999 : 230 + rnd(330);
      if (t === 'muisti') { r.count = Math.random() < .7 ? 5 : rnd(5); r.t = 4000 + rnd(6000); }
      if (t === 'matikka') { r.answers = G.mg.probs.map(x => Math.random() < .82 ? x.a : x.a + 1); r.t = 8000 + rnd(9000); }
      if (t === 'ovet') r.door = rnd(3);
      if (t === 'varit') { r.count = 6 + rnd(5); r.t = 9000 + rnd(9000); }
      if (t === 'uhri') r.bid = Math.round(p.score * pick([0, .1, .25, .5, 1]));
      if (t === 'kirstut') {
        const target = 3 + rnd(4); let n = 0;
        const step = () => { if (phaseKey() !== k) return; const st = G.mg.results[p.id]; if (st && st.final) return;
          if (n >= target) { handle(p, {t: 'mg', id, r: {stop: true}}); return; } n++; handle(p, {t: 'mg', id, r: {open: true}}); setTimeout(step, 900 + rnd(1200)); };
        step(); return;
      }
      handle(p, {t: 'mg', id, r});
    });
    if (['reveal', 'minigame', 'mg_result'].includes(G.phase) && Math.random() < .3) later(500 + rnd(3000), () => handle(p, {t: 'react', e: pick(['👻','😱','😂','🔥','💀','👏'])}));
  }
}

}
function timerBar() {

}
function chipStatus(p) {
  if (G.phase === 'question' && G.cur.kind === 'list') return `<span class="st ${p.answer != null ? 'ok' : ''}">📝${(p.list || []).filter(x => x.ok).length}</span>`;
  if (G.phase === 'question' && G.cur.kind === 'tf' && p.answer == null) return (p.tfAns || []).length ? `<span class="st">${p.tfAns.length}/5</span>` : '';
  if (G.phase === 'question') return p.answer != null ? '<span class="st ok">✓</span>' : '';

/* Splits text with "## Nimi" headings into [{name, text}]; text before the first heading goes to fallbackName. */
function splitSets(text, fallbackName) {
  const out = []; let cur = {name: fallbackName, lines: []};
  for (const line of String(text || '').split(/\r?\n/)) {
    const m = line.match(/^\s*##\s*(.+?)\s*$/);
    if (m) { out.push(cur); cur = {name: m[1].slice(0, 40), lines: []}; } else cur.lines.push(line);
  }
  out.push(cur);
  return out.map(x => ({name: x.name, text: x.lines.join('\n').trim()})).filter(x => x.text);
}

}

const P = {send: null, pid: null, code: '', name: '', emoji: '', view: null, key: null, recv: 0, local: {}, cleanup: [], status: 'idle'};
function pSend(d) { if (P.send) try { P.send(d); } catch (e) {} }
async function playerConnect(code) {
  const connId = uid();
  let bc = null; try { bc = new BroadcastChannel('kk-' + code); } catch (e) {}
  if (bc) {
    const ok = await new Promise(res => {
      const t = setTimeout(() => res(false), 700);
      bc.onmessage = e => { const m = e.data; if (m && m.to === connId && m.data && m.data.t === 'pong') { clearTimeout(t); res(true); } };
      bc.postMessage({from: connId, to: 'host', data: {t: 'ping'}});
    });
    if (ok) {
      bc.onmessage = e => { const m = e.data; if (m && m.to === connId) onHostMsg(m.data); };
      P.send = d => bc.postMessage({from: connId, to: 'host', data: d});
      P.lastHost = Date.now(); clearInterval(P.hb); P.hb = setInterval(() => pSend({t: 'hb'}), 5000);
      return;
    }
    bc.close();
  }
  const topicH = TOPIC(code) + '/h', topicC = TOPIC(code) + '/c/' + connId;
  const attempts = BROKERS.map(b => new MiniMqtt(b.url));
  const winner = await new Promise((res, rej) => {
    let left = attempts.length, won = false, sawConn = false;
    const fail = () => { if (--left === 0 && !won) rej(new Error(sawConn ? 'Peliä ei löytynyt koodilla ' + code + '. Tarkista koodi ja että juontajan aula on auki.' : 'Ei yhteyttä pelipalvelimiin. Tarkista nettiyhteys.')); };
    attempts.forEach(c => {
      c.connect(8000).then(() => {
        sawConn = true; c.subscribe(topicC);
        const ping = () => c.publish(topicH, JSON.stringify({f: connId, d: {t: 'ping'}}));
        const t1 = setTimeout(ping, 300), t2 = setTimeout(ping, 1800);
        const to = setTimeout(() => { if (!won || P.mq !== c) { c.close(); fail(); } }, 6000);
        c.onmessage = (t, p) => { let d; try { d = JSON.parse(p); } catch (e) { return; } if (d && d.t === 'pong' && !won) { won = true; clearTimeout(to); clearTimeout(t1); clearTimeout(t2); res(c); } };
      }).catch(fail);
    });
  });
  attempts.forEach(c => { if (c !== winner) { c.onclose = null; c.close(); } });
  P.mq = winner;
  winner.onmessage = (t, p) => { let d; try { d = JSON.parse(p); } catch (e) { return; } onHostMsg(d); };
  winner.onclose = onLost;
  P.send = d => winner.publish(topicH, JSON.stringify({f: connId, d}));
  P.lastHost = Date.now();
  clearInterval(P.hb);
  P.hb = setInterval(() => {
    if (P.status === 'lost') return clearInterval(P.hb);
    pSend({t: 'hb'});
    if (Date.now() - P.lastHost > 22000) { try { winner.onclose = null; winner.close(); } catch (e) {} onLost(); }
  }, 5000);
}
function onLost() {
  if (P.status === 'lost') return; P.status = 'lost'; P.send = null; P.key = null; clearInterval(P.hb);
  app.innerHTML = `<div class="player"><div></div><div class="pmain"><div class="big">🔌</div><h2>Yhteys katkesi</h2><p class="dim">Pelisi on tallessa. Yhdistä uudelleen.</p>
    <button class="btn primary" id="recon">Yhdistä uudelleen</button><p class="err" id="rerr"></p></div><div></div></div>`;
  $('#recon').onclick = async () => { $('#rerr').textContent = 'Yhdistetään…'; try { await playerConnect(P.code); P.status = 'ok'; pSend({t: 'join', pid: P.pid, name: P.name, emoji: P.emoji}); } catch (e) { $('#rerr').textContent = e.message; } };
}
function onHostMsg(d) {
  if (!d) return;
  P.lastHost = Date.now();
  if (d.t === 'hb' || d.t === 'pong') return;
  if (d.t === 'joined') { P.pid = d.pid; sstore.set('kk-me', {pid: P.pid, code: P.code, name: P.name, emoji: P.emoji}); return; }
  if (d.t === 'error') { renderJoin(d.msg); return; }
  if (d.t === 'kicked') { sstore.set('kk-me', null); P.send = null; renderJoin('Juontaja poisti sinut pelistä.'); return; }
  if (d.t === 'rejoin') { pSend({t: 'join', pid: P.pid, name: P.name, emoji: P.emoji}); return; }
  if (d.t === 'view') {
    P.view = d; P.recv = Date.now();

}

      const c = nv.mg && nv.mg.chest; if (!c || !$('#kg')) return;
      clicked.forEach((ci, k) => { const b = $(`.chest[data-c="${ci}"]`); if (!b) return;
        if (k < c.golds.length) { b.classList.remove('opening'); b.classList.add('open'); b.innerHTML = `💰<small>${c.golds[k]}</small>`; }
        else if (c.trapped && k === clicked.length - 1) { b.classList.remove('opening'); b.classList.add('trap'); b.textContent = '👹'; } });
      if (c.opened >= clicked.length) pending = false;
      $('#kg').textContent = c.gold;
      if (c.trapped) { $$('.chest').forEach(b => b.disabled = true); $('#kstop').disabled = true; $('#kmsg').textContent = 'KELLARIMESTARI! Menetit kaiken kullan.'; $('#kmsg').className = 'err'; P.local.onView = null; }
    };
  }
  if (mg.type === 'uhri') {
    const sc = mg.score || 0;
    box.innerHTML = `<h2>🕯️ Uhrilahja</h2><p style="margin:0">Sinulla on <b style="color:var(--y)">${sc} p</b>. Uhraa salaa.</p>
      <div class="bets">${[0, 100, 250, 500].filter(a => a <= sc).map(a => `<button class="bet" data-b="${a}">${a}</button>`).join('')}<button class="bet" data-b="${sc}">Kaikki</button></div>
      <form class="mathrow" id="uf"><input id="ui" inputmode="numeric" autocomplete="off" value="0" aria-label="Uhri pisteinä"><button class="btn primary" type="submit">Uhraa</button></form>
      <p class="dim" style="margin:0">Pienimmän uhrin antanut kuolee. Uhri menee joka tapauksessa.</p>`;
    $$('[data-b]').forEach(b => b.onclick = () => { $('#ui').value = b.dataset.b; });
    $('#uf').addEventListener('submit', e => { e.preventDefault(); const bid = Math.max(0, Math.min(sc, Math.round(Number($('#ui').value.replace(',', '.')) || 0)));
      send({bid, final: true}); done('Uhrasit ' + bid + ' p', 'Kellarimestari laskee lahjoja…'); });
  }
  if (mg.type === 'ovet') {
    box.innerHTML = `<h2>🚪 Kolme ovea</h2><p class="dim">Valitse ovi. Yhden takana odottaa Kellarimestari.</p><div class="doors">${[0, 1, 2].map(i => `<button class="door" data-d="${i}">${i + 1}</button>`).join('')}</div>`;
    $$('.door').forEach(d => d.onclick = () => { send({door: +d.dataset.d, final: true}); done('Ovi ' + (+d.dataset.d + 1) + ' valittu', 'Kahva narahtaa…'); });
  }
}

/* ================= timers (shared) ================= */
let lastTickSec = null;
function tickTimers() {
  const now = Date.now();
  $$('[data-until]').forEach(el => {
    const from = +el.dataset.from, until = +el.dataset.until;
    el.style.width = Math.max(0, Math.min(100, (until - now) / Math.max(1, until - from) * 100)) + '%';
  });
  $$('[data-secs]').forEach(el => {
    const s = Math.max(0, Math.ceil((+el.dataset.secs - now) / 1000)); el.textContent = s;
    if (G.role === 'host' && G.phase === 'question' && s <= 3 && s > 0 && lastTickSec !== s) { lastTickSec = s; SFX.tick(); }
  });
}
setInterval(tickTimers, 100);

/* ================= landing ================= */
function renderLanding() {
  G.role = null; document.body.classList.remove('is-ghost');
  app.innerHTML = `<div class="landing"><div class="inner">
    <div class="logo"><span class="a">KAAOS</span><br><span class="b">KARTANO</span></div>
    <p>Kaoottinen tietovisa, jossa kiusataan kavereita ja väärin vastanneet joutuvat kellariin. Juontaja pyörittää peliä isolla näytöllä, pelaajat liittyvät Chromebookilla koodilla.</p>
    <div class="roles">
      <button class="role play" id="r-play"><span style="font-size:2rem">🎮</span><b>Liity peliin</b><span class="dim">Pelaajille. Tarvitset juontajan koodin.</span></button>
      <button class="role" id="r-host"><span style="font-size:2rem">📽️</span><b>Juonna peliä</b><span class="dim">Opettajan kone, joka näytetään projektorilla.</span></button>
    </div></div></div>`;
  $('#r-play').onclick = () => renderJoin();
  $('#r-host').onclick = startHost;
}
function startHost() {
  G.sets = loadSets();
  G.settings.packs = (G.settings.packs || []).map(k => k === 'omat' ? 'c:omat' : k).filter(k => PACKS[k] || G.sets.some(x => 'c:' + x.id === k));
  if (!G.settings.packs.length) G.settings.packs = ['yleis'];
  G.role = 'host'; G.code = newCode(); G.quip = 'Kartano on auki. Liittykää, jos uskallatte.';
  audio(); hostNet(); setPhase('lobby');
}

/* ================= boot ================= */
(function boot() {
  const saved = sstore.get('kk-me', null);
  const hashCode = (location.hash || '').replace('#', '').toUpperCase();
  if (/^[A-Z]{4}$/.test(hashCode) || saved) renderJoin(); else renderLanding();
  window.addEventListener('beforeunload', e => { if (G.role === 'host' && G.phase !== 'lobby' && G.phase !== 'end') { e.preventDefault(); e.returnValue = ''; } });
})();
</script>
